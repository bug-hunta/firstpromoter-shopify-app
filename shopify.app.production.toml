# Production Partner app. Link with:
#   npx shopify app config link --config shopify.app.production.toml
# Then set application_url / redirect_urls to your Render origin and
#   npm run config:use -- shopify.app.production.toml
#   npm run deploy

client_id = "replace-with-production-client-id"
name = "FirstPromoter"
application_url = "https://YOUR-SERVICE.onrender.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = [
  "https://YOUR-SERVICE.onrender.com/auth/callback",
  "https://YOUR-SERVICE.onrender.com/api/auth",
]

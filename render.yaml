# Blueprint: https://render.com/docs/blueprint-spec
# Paid web + Postgres — Free web services sleep and will miss Shopify webhooks.
databases:
  - name: firstpromoter-shopify-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: firstpromoter-shopify
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: read_orders
      - key: DATABASE_URL
        fromDatabase:
          name: firstpromoter-shopify-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
